<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF1F2"/>
      <stop offset="100%" stopColor="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB7185"/>
      <stop offset="60%" stopColor="#F43F5E"/>
      <stop offset="100%" stopColor="#BE123C"/>
    </linearGradient>
    <linearGradient id="belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFE4E6"/>
      <stop offset="100%" stopColor="#FECDD3"/>
    </linearGradient>
  </defs>
  <!-- 背景円 -->
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>
  
  <!-- 四季の4色アクセントリングドット（春:桜, 夏:水色, 秋:橙, 冬:紫） -->
  <circle cx="16" cy="16" r="4" fill="#FB7185" />
  <circle cx="84" cy="16" r="4" fill="#38BDF8" />
  <circle cx="84" cy="84" r="4" fill="#F59E0B" />
  <circle cx="16" cy="84" r="4" fill="#818CF8" />

  <!-- 尾羽 -->
  <path d="M 40 70 L 22 90 C 20 92 24 94 26 91 L 46 72 Z" fill="#334155"/>
  <path d="M 43 71 L 28 88 C 26 90 29 91 31 89 L 47 73 Z" fill="#E2E8F0"/>

  <!-- まあるい体（オオマシコ） -->
  <circle cx="52" cy="52" r="26" fill="url(#body)"/>
  <ellipse cx="57" cy="58" rx="17" ry="19" fill="url(#belly)"/>

  <!-- 銀白色の冠羽 -->
  <path d="M 40 34 Q 50 24 64 30 Q 54 32 44 40 Z" fill="#FFFFFF"/>

  <!-- 翼 -->
  <path d="M 33 47 C 32 59 42 75 53 71 C 58 69 55 55 46 47 Z" fill="#334155"/>
  <path d="M 37 53 Q 44 58 50 56" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 39 60 Q 46 64 51 61" stroke="#FDA4AF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- 瞳 -->
  <circle cx="65" cy="42" r="3.5" fill="#0F172A"/>
  <circle cx="66" cy="41" r="1.2" fill="#FFFFFF"/>

  <!-- くちばし -->
  <polygon points="69,42 78,45 69,48" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- ほっぺ -->
  <ellipse cx="60" cy="47" rx="3.5" ry="2" fill="#FDA4AF" opacity="0.7"/>
</svg>
